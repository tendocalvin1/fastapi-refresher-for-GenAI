[project]
name = "fastapi-refresher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tendo Calvin", email = "tendo.calvin18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "argon2>=0.1.10",
    "email-validator>=2.3.0",
    "fastapi-users>=15.0.5",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "imagekitio>=5.13.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[project.scripts]
fastapi-refresher = "fastapi_refresher:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
